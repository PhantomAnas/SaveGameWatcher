name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: pyinstaller savewatch.spec
      - name: Smoke-run the exe (CLI path, no window)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src_test\slot | Out-Null
          Set-Content src_test\slot\a.sav "hello"
          # A windowed exe detaches from the console, so wait on the process explicitly.
          $p = Start-Process -FilePath (Resolve-Path dist\SaveWatch.exe) -ArgumentList "--cli","--source","src_test","--backup","bk_test","--once" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path bk_test\slot)) { throw "exe produced no backup" }
          Get-ChildItem bk_test\slot
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SaveWatch.exe
          generate_release_notes: true
